<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registered Employees</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            padding: 40px 20px;
            color: #333;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            animation: slideUp 0.6s ease-out;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        h1 {
            text-align: center;
            color: #302b63;
            margin-bottom: 10px;
            font-size: 28px;
        }
        h1::after {
            content: '';
            display: block;
            width: 80px;
            height: 4px;
            background: linear-gradient(to right, #667eea, #764ba2);
            margin: 12px auto 30px;
            border-radius: 2px;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }
        .count-badge {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
        }
        .btn-back {
            padding: 10px 24px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s;
        }
        .btn-back:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(102,126,234,0.5);
        }
        .search-box {
            width: 100%;
            padding: 12px 18px;
            border: 2px solid #dde1ea;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 20px;
            transition: border-color 0.3s;
        }
        .search-box:focus {
            border-color: #667eea;
            outline: none;
            box-shadow: 0 0 0 3px rgba(102,126,234,0.15);
        }
        .table-wrapper {
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        thead th {
            background: linear-gradient(135deg, #302b63, #24243e);
            color: #fff;
            padding: 14px 12px;
            text-align: left;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        thead th:first-child { border-radius: 8px 0 0 0; }
        thead th:last-child { border-radius: 0 8px 0 0; }
        tbody tr {
            transition: background 0.2s;
        }
        tbody tr:hover {
            background: #f0f2ff;
        }
        tbody td {
            padding: 12px;
            border-bottom: 1px solid #eef0f5;
            font-size: 13px;
        }
        tbody tr:last-child td:first-child { border-radius: 0 0 0 8px; }
        tbody tr:last-child td:last-child { border-radius: 0 0 8px 0; }
        .dept-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
        }
        .dept-hr { background: #fce4ec; color: #c62828; }
        .dept-engineering { background: #e3f2fd; color: #1565c0; }
        .dept-marketing { background: #fff3e0; color: #e65100; }
        .dept-finance { background: #e8f5e9; color: #2e7d32; }
        .dept-sales { background: #f3e5f5; color: #7b1fa2; }
        .dept-operations { background: #e0f2f1; color: #00695c; }
        .dept-it { background: #ede7f6; color: #4527a0; }
        .dept-admin { background: #fafafa; color: #424242; }
        .btn-delete {
            padding: 6px 14px;
            background: #e53935;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.2s;
        }
        .btn-delete:hover {
            background: #c62828;
            transform: scale(1.05);
        }
        .no-data {
            text-align: center;
            padding: 60px 20px;
            color: #999;
            font-size: 16px;
        }
        .no-data p {
            margin-top: 10px;
            font-size: 14px;
        }
        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #667eea;
            font-size: 16px;
        }
        @media (max-width: 768px) {
            .container { padding: 20px; }
            .top-bar { flex-direction: column; gap: 12px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Registered Employees</h1>
        <div class="top-bar">
            <a href="index.html" class="btn-back">&#8592; Back to Registration</a>
            <span class="count-badge" id="countBadge">Loading...</span>
        </div>

        <input type="text" class="search-box" id="searchBox" placeholder="Search by name, email, department, employee ID..." onkeyup="filterTable()">

        <div class="loading" id="loadingMsg">Loading employees...</div>
        <div class="no-data hidden" id="noDataMsg">
            <h3>No Employees Registered Yet</h3>
            <p>Go to the <a href="index.html">registration form</a> to add employees.</p>
        </div>
        <div class="table-wrapper hidden" id="tableWrapper">
            <table id="employeeTable">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Employee ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Department</th>
                        <th>Designation</th>
                        <th>Type</th>
                        <th>Salary</th>
                        <th>Join Date</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="employeeBody"></tbody>
            </table>
        </div>
    </div>

    <script>
    function filterTable() {
        const query = document.getElementById('searchBox').value.toLowerCase();
        const rows = document.querySelectorAll('#employeeTable tbody tr');
        rows.forEach(row => {
            const text = row.textContent.toLowerCase();
            row.style.display = text.includes(query) ? '' : 'none';
        });
    }

    function deleteEmployee(id) {
        if (!confirm('Are you sure you want to delete this employee?')) return;
        fetch('/api/delete', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id: id })
        })
        .then(res => res.json())
        .then(data => {
            if (data.success) {
                loadEmployees();
            } else {
                alert('Error: ' + data.message);
            }
        })
        .catch(() => alert('Failed to delete employee.'));
    }

    function loadEmployees() {
        document.getElementById('loadingMsg').classList.remove('hidden');
        document.getElementById('noDataMsg').classList.add('hidden');
        document.getElementById('tableWrapper').classList.add('hidden');

        fetch('/api/employees')
        .then(res => res.json())
        .then(data => {
            document.getElementById('loadingMsg').classList.add('hidden');

            if (!data.success || !data.employees || data.employees.length === 0) {
                document.getElementById('noDataMsg').classList.remove('hidden');
                document.getElementById('countBadge').textContent = 'Total: 0 Employees';
                return;
            }

            const employees = data.employees;
            document.getElementById('countBadge').textContent = 'Total: ' + employees.length + ' Employees';

            const deptLabels = {
                hr: 'Human Resources', engineering: 'Engineering', marketing: 'Marketing',
                finance: 'Finance', sales: 'Sales', operations: 'Operations',
                it: 'IT', admin: 'Administration'
            };

            let html = '';
            employees.forEach((emp, i) => {
                html += '<tr>';
                html += '<td>' + (i + 1) + '</td>';
                html += '<td><strong>' + emp.employeeId + '</strong></td>';
                html += '<td>' + emp.firstName + ' ' + emp.lastName + '</td>';
                html += '<td>' + emp.email + '</td>';
                html += '<td>' + emp.phone + '</td>';
                html += '<td><span class="dept-badge dept-' + emp.department + '">' + (deptLabels[emp.department] || emp.department) + '</span></td>';
                html += '<td>' + emp.designation + '</td>';
                html += '<td>' + emp.employmentType.charAt(0).toUpperCase() + emp.employmentType.slice(1) + '</td>';
                html += '<td>$' + Number(emp.salary).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2}) + '</td>';
                html += '<td>' + emp.joinDate + '</td>';
                html += '<td><button class="btn-delete" onclick="deleteEmployee(\'' + emp._id + '\')">Delete</button></td>';
                html += '</tr>';
            });

            document.getElementById('employeeBody').innerHTML = html;
            document.getElementById('tableWrapper').classList.remove('hidden');
        })
        .catch(() => {
            document.getElementById('loadingMsg').classList.add('hidden');
            document.getElementById('noDataMsg').classList.remove('hidden');
            document.getElementById('countBadge').textContent = 'Total: 0 Employees';
        });
    }

    loadEmployees();
    </script>
</body>
</html>
