<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Registration Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Employee Registration</h1>
        <form id="registrationForm" novalidate>

            <div class="form-section">
                <h2>Personal Information</h2>
                <div class="form-row">
                    <div class="form-group">
                        <label for="firstName">First Name *</label>
                        <input type="text" id="firstName" name="firstName" placeholder="Enter first name" required>
                        <span class="error" id="firstNameError"></span>
                    </div>
                    <div class="form-group">
                        <label for="lastName">Last Name *</label>
                        <input type="text" id="lastName" name="lastName" placeholder="Enter last name" required>
                        <span class="error" id="lastNameError"></span>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="email">Email *</label>
                        <input type="email" id="email" name="email" placeholder="Enter email address" required>
                        <span class="error" id="emailError"></span>
                    </div>
                    <div class="form-group">
                        <label for="phone">Phone Number *</label>
                        <input type="tel" id="phone" name="phone" placeholder="Enter phone number" required>
                        <span class="error" id="phoneError"></span>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="dob">Date of Birth *</label>
                        <input type="date" id="dob" name="dob" required>
                        <span class="error" id="dobError"></span>
                    </div>
                    <div class="form-group">
                        <label for="gender">Gender *</label>
                        <select id="gender" name="gender" required>
                            <option value="">Select Gender</option>
                            <option value="male">Male</option>
                            <option value="female">Female</option>
                            <option value="other">Other</option>
                        </select>
                        <span class="error" id="genderError"></span>
                    </div>
                </div>
            </div>

            <div class="form-section">
                <h2>Address Details</h2>
                <div class="form-group full-width">
                    <label for="address">Street Address *</label>
                    <textarea id="address" name="address" rows="3" placeholder="Enter street address" required></textarea>
                    <span class="error" id="addressError"></span>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="city">City *</label>
                        <input type="text" id="city" name="city" placeholder="Enter city" required>
                        <span class="error" id="cityError"></span>
                    </div>
                    <div class="form-group">
                        <label for="state">State *</label>
                        <input type="text" id="state" name="state" placeholder="Enter state" required>
                        <span class="error" id="stateError"></span>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="zipCode">Zip Code *</label>
                        <input type="text" id="zipCode" name="zipCode" placeholder="Enter zip code" required>
                        <span class="error" id="zipCodeError"></span>
                    </div>
                    <div class="form-group">
                        <label for="country">Country *</label>
                        <input type="text" id="country" name="country" placeholder="Enter country" required>
                        <span class="error" id="countryError"></span>
                    </div>
                </div>
            </div>

            <div class="form-section">
                <h2>Employment Details</h2>
                <div class="form-row">
                    <div class="form-group">
                        <label for="employeeId">Employee ID *</label>
                        <input type="text" id="employeeId" name="employeeId" placeholder="e.g. EMP-001" required>
                        <span class="error" id="employeeIdError"></span>
                    </div>
                    <div class="form-group">
                        <label for="department">Department *</label>
                        <select id="department" name="department" required>
                            <option value="">Select Department</option>
                            <option value="hr">Human Resources</option>
                            <option value="engineering">Engineering</option>
                            <option value="marketing">Marketing</option>
                            <option value="finance">Finance</option>
                            <option value="sales">Sales</option>
                            <option value="operations">Operations</option>
                            <option value="it">IT</option>
                            <option value="admin">Administration</option>
                        </select>
                        <span class="error" id="departmentError"></span>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="designation">Designation *</label>
                        <input type="text" id="designation" name="designation" placeholder="e.g. Software Engineer" required>
                        <span class="error" id="designationError"></span>
                    </div>
                    <div class="form-group">
                        <label for="salary">Salary (Annual) *</label>
                        <input type="number" id="salary" name="salary" placeholder="Enter salary" min="0" required>
                        <span class="error" id="salaryError"></span>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="joinDate">Join Date *</label>
                        <input type="date" id="joinDate" name="joinDate" required>
                        <span class="error" id="joinDateError"></span>
                    </div>
                    <div class="form-group">
                        <label for="employmentType">Employment Type *</label>
                        <select id="employmentType" name="employmentType" required>
                            <option value="">Select Type</option>
                            <option value="full-time">Full-Time</option>
                            <option value="part-time">Part-Time</option>
                            <option value="contract">Contract</option>
                            <option value="intern">Intern</option>
                        </select>
                        <span class="error" id="employmentTypeError"></span>
                    </div>
                </div>
            </div>

            <div class="form-section">
                <h2>Account Security</h2>
                <div class="form-row">
                    <div class="form-group">
                        <label for="password">Password *</label>
                        <div class="password-wrapper">
                            <input type="password" id="password" name="password" placeholder="Enter password" required>
                            <button type="button" class="toggle-password" onclick="togglePassword('password')">&#128065;</button>
                        </div>
                        <div class="strength-bar">
                            <div class="strength-fill" id="strengthFill"></div>
                        </div>
                        <span class="strength-text" id="strengthText"></span>
                        <span class="error" id="passwordError"></span>
                    </div>
                    <div class="form-group">
                        <label for="confirmPassword">Confirm Password *</label>
                        <div class="password-wrapper">
                            <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm password" required>
                            <button type="button" class="toggle-password" onclick="togglePassword('confirmPassword')">&#128065;</button>
                        </div>
                        <span class="error" id="confirmPasswordError"></span>
                    </div>
                </div>
            </div>

            <div class="form-group checkbox-group">
                <input type="checkbox" id="terms" name="terms" required>
                <label for="terms">I agree to the <a href="#">Terms and Conditions</a> *</label>
                <span class="error" id="termsError"></span>
            </div>

            <div class="button-group">
                <button type="reset" class="btn btn-reset" onclick="resetForm()">Reset</button>
                <button type="submit" class="btn btn-submit">Register Employee</button>
            </div>
        </form>

        <div id="successMessage" class="success-message hidden">
            <h2>&#10004; Registration Successful!</h2>
            <p>The employee has been registered successfully in the database.</p>
            <button class="btn btn-submit" onclick="showForm()">Register Another</button>
            <a href="view.html" class="btn btn-view">View All Employees</a>
        </div>

        <div class="view-link">
            <a href="view.html">View All Registered Employees &#8594;</a>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
